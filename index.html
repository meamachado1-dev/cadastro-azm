<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes — AZM Advocacia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #082256;
      --navy-deep: #051840;
      --navy-mid: #0d2e6e;
      --gold: #DCBA89;
      --gold-light: #e8ceaa;
      --gold-dark: #b8955e;
      --white: #ffffff;
      --off-white: #F1F1F1;
      --text-muted: rgba(241, 241, 241, 0.6);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--navy-deep);
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── BACKGROUND TEXTURE ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(220, 186, 137, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(8, 34, 86, 0.8) 0%, transparent 60%),
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 60px,
          rgba(220, 186, 137, 0.015) 60px,
          rgba(220, 186, 137, 0.015) 61px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* ── LINHA DOURADA TOPO ── */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
      z-index: 100;
    }

    /* ── WRAPPER ── */
    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      padding: 60px 40px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeDown 0.9s ease both;
    }

    .logo-wrap {
      margin-bottom: 40px;
    }

    .logo-wrap img {
      height: 120px;
      width: auto;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 32px;
    }

    .welcome-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(20px, 2.8vw, 28px);
      font-weight: 300;
      letter-spacing: 0.02em;
      color: var(--white);
      line-height: 1.5;
      max-width: 560px;
    }

    .welcome-title em {
      font-style: italic;
      color: var(--gold-light);
    }

    .welcome-sub {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
      max-width: 500px;
      line-height: 1.8;
    }

    /* ── BOTÃO ── */
    .form-section {
      flex: 1;
      padding: 0 24px 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeUp 1s ease 0.3s both;
    }

    .btn-cadastro {
      display: inline-block;
      padding: 18px 56px;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-cadastro::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(220, 186, 137, 0.08);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .btn-cadastro:hover::before {
      opacity: 1;
    }

    .btn-cadastro:hover {
      color: var(--white);
      border-color: var(--gold-light);
      letter-spacing: 0.25em;
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid rgba(220, 186, 137, 0.12);
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeUp 1s ease 0.5s both;
    }

    .footer-contacts {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      align-items: center;
    }

    .footer-contacts a {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      transition: color 0.25s ease;
    }

    .footer-contacts a:hover {
      color: var(--gold-light);
    }

    .footer-contacts a svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .footer-bottom {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: rgba(241, 241, 241, 0.25);
      text-transform: uppercase;
      text-align: center;
    }

    /* ── ORNAMENTO DECORATIVO ── */
    .ornament {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .ornament-line {
      width: 32px;
      height: 1px;
      background: rgba(220, 186, 137, 0.3);
    }

    .ornament-diamond {
      width: 5px;
      height: 5px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.6;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header {
        padding: 50px 24px 36px;
      }

      .logo-wrap img {
        height: 60px;
      }

      .welcome-title {
        font-size: 24px;
      }

      .form-container iframe {
        min-height: 900px;
      }

      .footer-contacts {
        flex-direction: column;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  </div>

</body>
